    #smc-content-toggle {
      flex-shrink: 0; background: none; cursor: pointer; white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 999px;
      color: var(--allegion-muted); font-size: 11px; font-family: var(--antenna);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 4px 12px; transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    #smc-content-toggle:hover { color: var(--allegion-text); border-color: rgba(255,255,255,0.3); }
    #smc-content-toggle.smc-toggle-on {
      background: rgba(255,103,31,0.15); color: #FF671F;
      border-color: rgba(255,103,31,0.5);
    }
    #search-modal-content { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    .smc-col {
      flex: 1; overflow-y: auto; min-height: 0; padding-bottom: 12px;
    }
    .smc-col + .smc-col { border-left: 1px solid rgba(255,255,255,0.09); }
    .smc-col::-webkit-scrollbar { width: 4px; }
    .smc-col::-webkit-scrollbar-track { background: transparent; }
    .smc-col::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 999px; }
    .smc-section-head {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--allegion-muted); font-family: var(--antenna); padding: 10px 20px 5px;
    }
    .smc-section-head + * { border-top: none; }
    .smc-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 9px 20px;
      cursor: pointer; transition: background 0.12s;
    }
    .smc-row:hover { background: rgba(255,255,255,0.07); }
    .smc-name { flex: 1; font-size: 15px; color: var(--allegion-text); line-height: 1.45; }
    .smc-snippet {
      font-size: 12px; color: var(--allegion-muted); line-height: 1.5; margin-top: 3px;
    }
    .smc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .smc-risk-badge {
      font-size: 11px; font-weight: 700; font-family: var(--antenna);
      padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,0.1);
      white-space: nowrap;
    }
    .smc-status-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      font-family: var(--antenna); padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    }
    .smc-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 6px 0; }
    .smc-empty { padding: 20px 20px; font-size: 14px; color: var(--allegion-muted); text-align: center; }
    /* Search dim — independent of dot-hover dim so they can coexist */
    #legend-layer.search-active .legend-row:not(.legend-row-hl) { opacity: 0.18; transition: opacity 0.18s; }
    #legend-layer.search-active .legend-row.legend-row-hl       { opacity: 1;    transition: opacity 0.18s; }

    /* ── Risk list header bar — all inner sizes driven by JS via CSS vars ───── */
    #risk-header-bar {
      position: fixed; z-index: 200;
      display: flex; align-items: center;
      background: #363637;
      border-radius: 10px 10px 0 0; /* overridden by JS to match SVG card rx at current scale */
      border-bottom: 1px solid #3F3F40;
      overflow: visible;
      padding-left: var(--rh-pad-l, 40px);
      padding-right: var(--rh-pad-r, 10px);
    }
    .rh-col {
      font-size: var(--rh-col-font, 11px); font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: #FF671F;
      font-family: var(--antenna); white-space: nowrap; flex-shrink: 0;
    }
    #rh-id  {
      width: var(--rh-id-w, 18px); flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.22);
      padding-right: var(--rh-id-pr, 4px);
      margin-right: var(--rh-id-mr, 6px);
    }
    #rh-name { flex: 1; min-width: 0; }
    .rh-divider {
      width: 1px; background: rgba(255,255,255,0.22); align-self: stretch;
      margin: 20% var(--rh-div-mx, 9px); flex-shrink: 0;
    }
    #cat-filter-btn {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16);
      border-radius: var(--rh-btn-r, 10px);
      padding: var(--rh-btn-pad-v, 5px) var(--rh-btn-pad-h, 11px);
      color: #FF671F; font-size: var(--rh-btn-font, 13px); font-weight: 600; cursor: pointer;
      font-family: var(--antenna); transition: filter 0.15s, border-color 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    #cat-filter-btn:hover { filter: brightness(1.22); border-color: rgba(255,255,255,0.28); }
    #cat-filter-btn.filtered { border-color: #6699cc; color: #a8c0ff; }
    /* Glow when open so users know which pill owns the visible menu */
    #cat-filter-btn.open, #rh-mf-btn.open {
      background: rgba(255,103,31,0.16); border-color: rgba(255,103,31,0.7);
      box-shadow: 0 0 0 2px rgba(255,103,31,0.22);
    }
    /* cat-filter-btn is now an icon circle — dot indicator when categories filtered */
    #cat-filter-btn { position: relative; }
    #cat-active-dot {
      display: none; position: absolute; top: 4px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%; background: #FF671F;
      border: 1.5px solid rgba(28,28,30,0.9);
    }
    #cat-filter-btn.filtered #cat-active-dot { display: block; }
    /* ── Owner filter — icon circle matching search button ───────────────── */
    #owner-filter-btn {
      display: flex; align-items: center; justify-content: center; position: relative;
      background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16);
      border-radius: var(--rh-btn-r, 10px); padding: var(--rh-btn-p, 8px 14px);
      color: #FF671F; cursor: pointer; flex-shrink: 0;
      transition: filter 0.15s, border-color 0.15s;
    }
    #owner-filter-btn:hover { filter: brightness(1.22); border-color: rgba(255,255,255,0.28); }
    #owner-filter-btn.open { background: rgba(255,103,31,0.16); border-color: rgba(255,103,31,0.7); box-shadow: 0 0 0 2px rgba(255,103,31,0.22); }
    /* Small indicator dot when an owner is selected */
    #owner-active-dot {
      display: none; position: absolute; top: 4px; right: 4px;
      width: 7px; height: 7px; border-radius: 50%; background: #FF671F;
      border: 1.5px solid rgba(28,28,30,0.9);
    }
    #owner-filter-btn.filtered #owner-active-dot { display: block; }
    #owner-dropdown {
      display: none; position: absolute; top: calc(100% + 6px);
      right: 0; flex-direction: column; gap: 2px;
      min-width: var(--rh-dd-min-w, 240px); max-width: 300px; max-height: 360px;
      overflow-x: hidden; overflow-y: auto; z-index: 300; transform-origin: top right;
      max-height: 70vh;
      background: rgba(20,20,22,0.97);
      border: 1px solid rgba(255,103,31,0.38); border-top-color: rgba(255,103,31,0.65);
      border-radius: 20px; padding: 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 16px 48px rgba(0,0,0,0.72);
    }
    #owner-dropdown.open    { display: flex; flex-direction: column; animation: menuSlideIn  0.30s cubic-bezier(0.16,1,0.3,1) both; }
    #owner-dropdown.closing { display: flex; flex-direction: column; animation: menuSlideOut 0.16s cubic-bezier(0.4,0,1,1)    both; }
    #owner-dropdown::-webkit-scrollbar { width: 4px; }
    #owner-dropdown::-webkit-scrollbar-track { background: transparent; }
    #owner-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 999px; }
    .owner-dd-row {
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: var(--rh-btn-font, 13px); font-weight: 600;
      color: var(--allegion-text); transition: background 0.12s;
      white-space: nowrap; /* container clips via overflow-x: hidden */
    }
    .owner-dd-row:hover { background: rgba(255,255,255,0.09); }
    .owner-dd-row.active { background: rgba(255,103,31,0.15); color: #FF671F; }
    /* stale top10 CSS removed — see new #top10-panel rule above */
    #cat-dropdown {
      display: none; position: absolute; top: calc(100% + 6px);
      left: 50%; margin-left: calc(var(--rh-dd-min-w, 240px) * -0.5);
      flex-direction: column; gap: 5px;
      background: rgba(20,20,22,0.97);
      border: 1px solid rgba(255,103,31,0.38);
      border-top-color: rgba(255,103,31,0.65);
      border-radius: 20px; padding: 10px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10),
                  0 16px 48px rgba(0,0,0,0.72);
      min-width: var(--rh-dd-min-w, 240px); z-index: 300;
      transform-origin: top right;
    }
    #cat-dropdown.open    { display: flex; animation: menuSlideIn  0.30s cubic-bezier(0.16,1,0.3,1) both; }
    #cat-dropdown.closing { display: flex; animation: menuSlideOut 0.16s cubic-bezier(0.4,0,1,1)    both; }
    .cat-dd-row {
      display: flex; align-items: center; gap: 10px;
      padding: var(--rh-dd-pad-v, 8px) var(--rh-dd-pad-h, 12px);
      border-radius: 20px; cursor: pointer;
      transition: background 0.12s, opacity 0.2s;
    }
    .cat-dd-row:hover { background: rgba(255,255,255,0.07); }
    .cat-dd-swatch {
      width: var(--rh-dd-dot, 10px); height: var(--rh-dd-dot, 10px);
      border-radius: 50%; flex-shrink: 0; box-sizing: border-box;
      background: var(--swatch-col);
      border: 2px solid transparent;
      transition: background 0.18s, border-color 0.18s;
    }
    .cat-dd-label {
      flex: 1; font-size: var(--rh-dd-font, 13px); font-weight: 500;
      font-family: var(--antenna); color: #E8EAED;
    }
    .cat-dd-row.off { opacity: 0.45; }
    .cat-dd-row.off .cat-dd-swatch {
      background: transparent;
      border-color: var(--swatch-col);
    }
    /* ── User guide modal ────────────────────────────────────────────────── */
    #guide-modal {
      display: none; position: fixed; inset: 0; z-index: 1200;
      align-items: center; justify-content: center;
    }
    #guide-modal.open { display: flex; }
    #guide-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); cursor: pointer; }
    #guide-modal-box {
      position: relative; z-index: 1; box-sizing: border-box;
      background: rgba(22,22,24,0.80);
      backdrop-filter: blur(20px) saturate(180%) brightness(1.08);
      -webkit-backdrop-filter: blur(20px) saturate(180%) brightness(1.08);
      border: 1px solid rgba(255,255,255,0.14); border-top-color: rgba(255,255,255,0.44);
      border-radius: 20px; padding: 0;
      width: min(920px, calc(100vw - 48px));
      max-height: calc(100vh - 60px); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 24px 64px rgba(0,0,0,0.6);
      animation: modalBoxIn 0.30s cubic-bezier(0.16,1,0.3,1) both;
    }
    #guide-modal-close {
      position: absolute; top: 14px; right: 18px; background: none; border: none;
      color: var(--allegion-muted); font-size: 26px; cursor: pointer; line-height: 1;
      z-index: 2; transition: color 0.18s;
    }
    #guide-modal-close:hover { color: #E53935; }
    #guide-modal-header {
      display: flex; align-items: center; gap: 10px; position: relative;
      padding: 18px 52px 18px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    #guide-modal-title {
      font-size: 16px; font-weight: 700; font-family: var(--antenna); color: var(--allegion-text);
    }
    #guide-body { display: flex; flex: 1; overflow: hidden; }
    #guide-nav {
      width: 260px; flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--allegion-border) transparent;
    }
    #guide-nav::-webkit-scrollbar       { width: 5px; }
    #guide-nav::-webkit-scrollbar-track { background: transparent; }
    #guide-nav::-webkit-scrollbar-thumb { background: var(--allegion-border); border-radius: 3px; }
    #guide-nav::-webkit-scrollbar-thumb:hover { background: var(--allegion-muted); }
    #guide-search-input {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; color: var(--allegion-text);
      padding: 8px 12px; font-size: 13px; font-family: var(--antenna);
      margin-bottom: 10px;
    }
    #guide-search-input::placeholder { color: var(--allegion-muted); }
    #guide-search-input:focus { outline: none; border-color: #FF671F; }
    .guide-nav-category {
      font-size: 10px; font-weight: 700; color: var(--allegion-muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 12px 2px 4px;
    }
    .guide-nav-category:first-child { margin-top: 0; }
    .guide-nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px;
      color: var(--allegion-text); font-size: 13px; font-family: var(--antenna);
      cursor: pointer; transition: background 0.15s, color 0.15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .guide-nav-item:hover { background: rgba(255,255,255,0.06); }
    .guide-nav-item.active { background: rgba(255,103,31,0.14); color: #FF671F; font-weight: 600; }
    .guide-nav-empty { color: var(--allegion-muted); font-size: 13px; padding: 10px 4px; text-align: center; }
    #guide-detail {
      flex: 1; overflow-y: auto; padding: 24px 28px;
      scrollbar-width: thin;
      scrollbar-color: var(--allegion-border) transparent;
    }
    #guide-detail::-webkit-scrollbar       { width: 6px; }
    #guide-detail::-webkit-scrollbar-track { background: transparent; }
    #guide-detail::-webkit-scrollbar-thumb { background: var(--allegion-border); border-radius: 3px; }
    #guide-detail::-webkit-scrollbar-thumb:hover { background: var(--allegion-muted); }
    .guide-detail-icon { font-size: 28px; margin-bottom: 8px; }
    .guide-detail-title {
      font-size: 18px; font-weight: 700; font-family: var(--antenna);
      color: var(--allegion-text); margin-bottom: 12px;
    }
    .guide-detail-desc { font-size: 14px; color: var(--allegion-text); line-height: 1.6; margin-bottom: 18px; }
    .guide-detail-tips-label {
      font-size: 11px; font-weight: 700; color: var(--allegion-muted);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
    }
    .guide-detail-tips { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 8px; }
    .guide-detail-tips li { font-size: 13px; color: var(--allegion-muted); line-height: 1.5; padding-left: 18px; position: relative; }
    .guide-detail-tips li::before { content: '•'; color: #FF671F; position: absolute; left: 4px; }
    /* ── GUIDE FEATURE VISUAL PREVIEWS ──────────────── */
    .guide-preview-frame {
      background: rgba(0,0,0,0.18);
      border: 1px dashed var(--allegion-border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
    }
    .guide-preview-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--allegion-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    /* Previews reuse real app classes for pixel-accurate mockups — disable
       interaction so they read as illustrations, not live controls */
    .guide-preview-frame button, .guide-preview-frame input { pointer-events: none; }
    .guide-inspect-btn {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(255,103,31,0.1); border: 1px solid rgba(255,103,31,0.4);
      border-radius: 20px; color: #FF671F;
      padding: 6px 16px; font-size: 12px; font-weight: 600; font-family: var(--antenna);
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .guide-inspect-btn:hover { background: rgba(255,103,31,0.22); }
    body.guide-inspect-active,
    body.guide-inspect-active * { cursor: crosshair !important; }
    #guide-inspect-indicator {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(30,30,35,0.92); border: 1px solid #FF671F;
      border-radius: 20px; color: var(--allegion-text); font-size: 13px;
      font-family: var(--antenna); padding: 8px 18px; z-index: 1300;
      display: none; align-items: center; gap: 8px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #guide-inspect-indicator.visible { display: flex; }
    #guide-inspect-indicator.no-match {
      background: rgba(60,20,20,0.92); border-color: #E53935;
    }
  </style>
</head>
<body>
<div id="wrap">
  <svg id="hm" viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradient uses userSpaceOnUse so JS can anchor it to data coords (0,0)→(5,5).
           When zoomed/panned, updateGradientCoords() moves the anchor points so the
           green/yellow/red colours always correspond to the correct risk levels. -->
      <linearGradient id="gDiag" gradientUnits="userSpaceOnUse"
                      x1="130" y1="700" x2="730" y2="20">
        <stop offset="0%"   stop-color="#8BC34A"/>
        <stop offset="25%"  stop-color="#8BC34A"/>
        <stop offset="46%"  stop-color="#FFEE58"/>
        <stop offset="61%"  stop-color="#FF9800"/>
        <stop offset="100%" stop-color="#E53935"/>
      </linearGradient>
    <clipPath id="chartClip">
      <!-- Clip to the exact plot area (P.x=130, P.y=20, P.w=600, P.h=680) -->
      <path d="M 150,20 L 730,20 L 730,700 L 150,700 Q 130,700 130,680 L 130,40 Q 130,20 150,20 Z"/>
    </clipPath>
    </defs>
    <g id="chart-inner">
      <g id="static-layer"></g>
      <!-- Clip wrapper never transforms — keeps clip fixed in plot space -->
      <g clip-path="url(#chartClip)">
        <g id="trend-layer"></g>   <!-- ghost dots + dotted trails, behind current dots -->
        <g id="risks-layer"></g>
      </g>
    </g>
    <g id="legend-layer"></g>
  </svg>
</div>
<div id="filter-chip-menu"></div>
<div id="active-chips">
  <div id="spotlight-chip" class="status-chip">
    <span class="chip-icon">person_search</span>
    <span id="spotlight-chip-label"></span>
    <button class="chip-close" onclick="clearSpotlight()" title="Clear spotlight">✕</button>
  </div>
  <div id="filter-chip" class="status-chip">
    <span class="chip-icon">filter_list</span>
    <span id="filter-chip-label"></span>
    <button class="chip-close" onclick="clearAllFilters()" title="Clear filters">✕</button>
  </div>
  <div id="reset-all-chip" class="status-chip" style="cursor:pointer">
    <span class="chip-icon" style="font-size:14px">restart_alt</span>
    <span id="rac-label">Reset All</span>
  </div>
</div>
<!-- ── Floating fullscreen button — top-right corner (hidden, see CSS) ─── -->
<button id="fullscreen-btn" onclick="window.open(window.location.href,'_blank')" title="Open fullscreen in new tab">
  <span class="material-symbols-outlined" style="font-size:16px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300">open_in_new</span>
</button>
<!-- ── Floating user guide button — top-right corner ────────────────── -->
<button id="guide-btn" title="Open the user guide">
  <span class="material-symbols-outlined" style="font-size:16px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300">help</span>
  Guide
</button>

<!-- ── Chart pill buttons + shared panel ─────────────────────────────── -->
<div id="cp-pills">
  <button class="cp-pill" id="pill-top10" onclick="openChartPanel('top10')">
    <span class="material-symbols-outlined" style="font-size:13px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300">bar_chart</span>
    Risks
    <span class="cp-badge">10</span>
  </button>
  <button class="cp-pill" id="pill-tasks" onclick="openChartPanel('tasks')">
    <span class="material-symbols-outlined" style="font-size:13px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300">task_alt</span>
    Tasks
    <span class="cp-badge">10</span>
  </button>
</div>
<div id="cp-panel" style="display:none">
  <div id="cp-panel-header">
    <span class="material-symbols-outlined" style="font-size:13px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300" id="cp-panel-icon">bar_chart</span>
    <span id="cp-panel-title">Top 10 — Highest Severity</span>
    <button id="cp-panel-close" onclick="closeChartPanel()">&#215;</button>
  </div>
  <div id="cp-panel-body"></div>
</div>

<div id="zoom-ctrl">
  <button class="icon-btn" onclick="doZoom(1.3)" title="Zoom in">+</button>
  <button id="zoom-reset" class="icon-btn" onclick="resetView()" title="Reset view">
    <span class="material-symbols-outlined" style="font-size:20px;line-height:1;font-family:'Material Symbols Outlined';font-weight:300">refresh</span>
  </button>
  <button class="icon-btn" onclick="doZoom(0.77)" title="Zoom out">&minus;</button>
  <button id="label-toggle" onclick="toggleLabels()" title="Toggle labels">Labels</button>
</div>
<!-- ── Task detail modal ──────────────────────────────────────────────────── -->
<div id="task-detail-modal">
  <div id="task-detail-overlay" onclick="closeTaskDetail()"></div>
  <div id="task-detail-box">
    <button id="task-detail-close" onclick="closeTaskDetail()">&#215;</button>
    <div id="task-detail-viewport">
      <div id="task-detail-content"></div>
    </div>
    <div id="task-detail-nav">
      <button id="tdm-prev" onclick="prevTaskDetail()">
        <span class="material-symbols-outlined" style="font-size:20px;font-family:'Material Symbols Outlined';font-weight:300;font-variation-settings:'wght' 300;line-height:1">chevron_left</span>

function dimLegend(on) {
  if (on && _suppressHoverDim) return; // ignore hover-triggered dims during rebuild
  _dimCount = Math.max(0, _dimCount + (on ? 1 : -1));
  document.getElementById('legend-layer').classList.toggle('legend-dimmed', _dimCount > 0);
}

function parseResidualVal(v) {
  if (!v || v === 'None') return null;
  const n = parseFloat(v);
  if (!isNaN(n)) return n;
  const m = {'very low':0.5,'low':1,'medium low':1.5,'medium':2.5,'moderate':2.5,
             'medium high':3.5,'high':4,'very high':4.5,'extreme':5,'critical':5};
  return m[String(v).toLowerCase().trim()] ?? null;
}

function _isRiskVisible(r) {
  if (_hiddenCatColors.has(catColor(r.category || ''))) return false;
  if (_activeFilters.status.size > 0 && !_activeFilters.status.has(r.status || '')) return false;
  if (_activeFilters.health.size > 0 && !_activeFilters.health.has(r.mitigation_health || '')) return false;
  if (_activeFilters.overdue && String(r.review_overdue).toLowerCase() !== 'true') return false;
  if (_activeFilters.quarter.size > 0 && !_activeFilters.quarter.has(r.quarter || '')) return false;
  if (_ownerFilter && !_isOwnerMatch(r)) return false;
  return true;
}
const catKeyElByColor   = {};        // color → category key card <g> element
let   _panDelay         = null;      // setTimeout ID for 1-second pan delay

let _catFilterAnimating = false;

// CSS inline transitions for filter dot animations.
// CSS transitions on opacity+transform are always compositor-driven on SVG,
// including inside clip-path containers (unlike Web Animations API on SVG).
let _filterRerenderTimer = null;
let _filterPrevVisible   = new Set();

function _updateLegendRowVisibility() {
  // Toggle CSS class on existing rows — O(31) class mutations, no DOM rebuild, instant.
  // This gives immediate visual feedback without the GPU rasterization cost of renderLegend().
  RISKS.forEach(r => {
    const row = legendRowByRiskId[r.id];
    if (row) row.classList.toggle('legend-row-cat-off', !_isRiskVisible(r));
  });
}

function _applyFilterWithAnimation(prevVisibleIds) {
  const STAGGER = 35;
  _updateLegendRowVisibility(); // instant list feedback — no expensive DOM rebuild
  const nowVisible = new Set(RISKS.filter(r => _isRiskVisible(r)).map(r => r.id));
  if (!_filterRerenderTimer) _filterPrevVisible = new Set(prevVisibleIds);
  const prevSnap = prevVisibleIds, nowSnap = nowVisible;

  const toExit = [];
  const seen = new Set();
  Object.entries(dotGroupByRiskId).forEach(([id, dg]) => {
    if (seen.has(dg)) return; seen.add(dg);
    if (dg._exiting) return; // already animating out
    const grp = dotRisksGroupById[id] || [];
    if (grp.some(r => prevSnap.has(r.id)) && grp.every(r => !nowSnap.has(r.id))) {
      dg._exiting = true;
      toExit.push(dg);
    }
  });

  if (toExit.length) {
    // Class on dotG (.dot-hover): keyframes include filter:none so filter is removed
    // from the very first frame — no separate mutation, no extra style recalculation.
    toExit.forEach((dg, i) => {
      dg.style.animationDelay = Math.min(i * STAGGER, 200) + 'ms';
      dg.classList.remove('dot-cat-enter');
      dg.classList.add('dot-cat-exit');
    });
  }

  clearTimeout(_filterRerenderTimer);
  _filterRerenderTimer = setTimeout(() => {
    const baseline = new Set(_filterPrevVisible);
    _filterRerenderTimer = null; _filterPrevVisible = new Set();
    rerender();
    requestAnimationFrame(() => {
      renderLegend(); // full rebuild once at debounce end — restores correct row heights/counts
      const toEnter = [];
      const seen2 = new Set(); let enterIdx = 0;
      Object.entries(dotGroupByRiskId).forEach(([id, dg]) => {
        if (seen2.has(dg)) return; seen2.add(dg);
        const grp = dotRisksGroupById[id] || [];
        if (grp.some(r => !baseline.has(r.id))) toEnter.push({ dg, i: enterIdx++ });
      });
      if (toEnter.length) {
        toEnter.forEach(({ dg, i }) => {
          dg.style.animationDelay = Math.min(i * STAGGER, 200) + 'ms';
          dg.classList.add('dot-cat-enter');
          dg.addEventListener('animationend', () => {
            dg.classList.remove('dot-cat-enter'); dg.style.animationDelay = '';
          }, { once: true });
        });
      }
    });
  }, 600);
}

function updateCatFilter(col, isHiding) {
  // Instant legend feedback via CSS class toggle (no DOM rebuild)
  Object.entries(catKeyElByColor).forEach(([c, el]) =>
    el.classList.toggle('off', _hiddenCatColors.has(c)));
  RISKS.forEach(r => {
    const row = legendRowByRiskId[r.id];
    if (row) row.classList.toggle('legend-row-cat-off', _hiddenCatColors.has(catColor(r.category || '')));
  });

  if (isHiding) {
    // Animate hiding dots — uses the SAME shared _filterRerenderTimer as multi-filter.
    // This guarantees no independent timer fires rerender mid-animation.
    const seen = new Set(), toAnimate = [];
    Object.entries(dotGroupByRiskId).forEach(([id, dg]) => {
      if (seen.has(dg)) return; seen.add(dg);
      if (dg._exiting) return; // skip already-animating dots
      const grp = dotRisksGroupById[id] || [];
      if (grp.every(r => _hiddenCatColors.has(catColor(r.category || '')))) {
        dg._exiting = true;
        toAnimate.push({ dg });
      }
    });
    if (!toAnimate.length) {
      // Nothing to animate — still reset shared debounce so rerender fires
      clearTimeout(_filterRerenderTimer);
      _filterRerenderTimer = setTimeout(() => {
        _filterRerenderTimer = null; _filterPrevVisible = new Set();
        rerender(); requestAnimationFrame(() => renderLegend());
      }, 600);
      return;
    }
    const STAGGER = 45;
    toAnimate.forEach(({ dg }, i) => {
      dg.style.animationDelay = Math.min(i * STAGGER, 250) + 'ms';
      dg.classList.remove('dot-cat-enter');
      dg.classList.add('dot-cat-exit');
    });
    // Shared debounce — resets on EVERY filter click so rerender always waits
    clearTimeout(_filterRerenderTimer);
    _filterRerenderTimer = setTimeout(() => {
      _filterRerenderTimer = null; _filterPrevVisible = new Set();
      rerender(); requestAnimationFrame(() => renderLegend());
    }, 600);

  } else {
    // Show: rerender dots + rebuild legend so newly visible rows reappear in the list.
    // renderLegend() is needed because the 600ms hide-timer called renderLegend() WITHOUT
    // these risks, clearing their legendRowByRiskId entries — the CSS class toggle alone
    // can't restore rows that no longer exist in the DOM.
    rerender();
    renderLegend();
    const seen = new Set(), toAnimate = [];
    RISKS.filter(r => catColor(r.category || '') === col).forEach(r => {
      const dg = dotGroupByRiskId[r.id];
      if (dg && !seen.has(dg)) { seen.add(dg); toAnimate.push(dg); }
    });
    const STAGGER = 45;
    toAnimate.forEach((dg, i) => {
      dg.style.animationDelay = Math.min(i * STAGGER, 250) + 'ms';
      dg.classList.add('dot-cat-enter');
      dg.addEventListener('animationend', () => {
        dg.classList.remove('dot-cat-enter'); dg.style.animationDelay = '';
      }, { once: true });
    });
  }
}

function _reapplyLegendHighlights() {
  if (!_activeLegendRows.size) return;
  _activeLegendRows.forEach(id => {
    const row = legendRowByRiskId[id];
    if (!row || row.classList.contains('legend-row-cat-off')) return;
    row.classList.add('legend-row-hl');
    const dg = dotGroupByRiskId[id]; if (dg) dg.classList.add('dot-force-highlight');
    dimLegend(true); // increment once per actually-restored row so _dimCount stays accurate
  });
}

// Animated pan — fast dot-only render during frames, full rerender at end
let _panAnim = null;
function _fastRerender() {
  updateGradientCoords();
  const sl = document.getElementById('static-layer');
  while (sl.firstChild) sl.removeChild(sl.firstChild);
  renderStatic();
  const rl = document.getElementById('risks-layer');
  while (rl.firstChild) rl.removeChild(rl.firstChild);
  groupRisks(RISKS).forEach(({ risks, likelihood, severity }) => {
    const cx = svgX(likelihood), cy = svgY(severity);
    drawPieDot(cx, cy, risks.map(r => r.category || ''), mk('g', {}, rl));
  });
}
function panToRisk(risk) {
  const tx = snap(risk.likelihood), ty = snap(risk.severity);
  const pad = 0.15;
  if (tx > VR.xMin + pad && tx < VR.xMax - pad && ty > VR.yMin + pad && ty < VR.yMax - pad) return;
  const rW = VR.xMax - VR.xMin, rH = VR.yMax - VR.yMin;
  const tXMin = Math.max(0, Math.min(5 - rW, tx - rW / 2));
  const tYMin = Math.max(0, Math.min(5 - rH, ty - rH / 2));
  const tXMax = tXMin + rW, tYMax = tYMin + rH;
  if (Math.abs(tXMin - VR.xMin) < 0.01 && Math.abs(tYMin - VR.yMin) < 0.01) return;
  const sXMin = VR.xMin, sXMax = VR.xMax, sYMin = VR.yMin, sYMax = VR.yMax;
  const dur = 380, t0 = performance.now();
  if (_panAnim) { cancelAnimationFrame(_panAnim); _panAnim = null; }
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    VR.xMin = sXMin + (tXMin - sXMin) * e;  VR.xMax = sXMax + (tXMax - sXMax) * e;
    VR.yMin = sYMin + (tYMin - sYMin) * e;  VR.yMax = sYMax + (tYMax - sYMax) * e;
    if (p < 1) { _fastRerender(); _panAnim = requestAnimationFrame(step); }
    else { VR.xMin=tXMin; VR.xMax=tXMax; VR.yMin=tYMin; VR.yMax=tYMax; rerender(); _panAnim=null; }
  }
  _panAnim = requestAnimationFrame(step);
}

const P    = { x: 130, y: 20, w: 600, h: 680 };
const MAX       = 5;
const FONT      = 'Roboto, Segoe UI, Arial, sans-serif';
const AXIS_FONT = 'Antenna, Roboto, Segoe UI, Arial, sans-serif';
const LB        = { xMin: P.x + 2, yMin: P.y + 2, xMax: P.x + P.w - 2, yMax: P.y + P.h - 2 };

const LEG_X = P.x + P.w + 40;  // card left = P.x+P.w (flush with graph right edge)
let _graphAllRounded = true;   // true only during entrance animation phase 1

// Data view range — changes on zoom/pan; svgX/svgY map data into the fixed plot square
let VR = { xMin: 0, xMax: 5, yMin: 0, yMax: 5 };

function svgX(v) { return P.x + (v - VR.xMin) / (VR.xMax - VR.xMin) * P.w; }
function svgY(v) { return P.y + (1 - (v - VR.yMin) / (VR.yMax - VR.yMin)) * P.h; }
function dataX(sx) { return VR.xMin + (sx - P.x) / P.w * (VR.xMax - VR.xMin); }
function dataY(sy) { return VR.yMin + (1 - (sy - P.y) / P.h) * (VR.yMax - VR.yMin); }

// ── SVG helpers ───────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function mk(tag, a, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function mktxt(content, a, parent) {
  const e = mk('text', a, parent);
  e.textContent = content;
  return e;
}

  ['Technology/Cybersecurity Risks', '#C6FF00'],
  ['Human Capital Risks',            '#00E676'],
  ['Governance / Compliance Risks',  '#FF80AB'],
  ['Environmental / External Risks', '#82B1FF'],
  ['Financial Risks',                '#FFD740'],

];

function catColor(cat) {
  if (!cat) return '#555';
  const k = cat.toLowerCase().trim().replace(/\s*risks?\s*$/, '').trim();
  return CAT_MAP[k] || '#555';
}

// Lookup: risk id → category
const ID_TO_CAT = {};
RISKS.forEach(r => { ID_TO_CAT[r.id] = r.category || ''; });

// ── Grouping / label sizing ───────────────────────────────────────────────────
function snap(v) { return Math.round(v * 2) / 2; }

function groupRisks(risks) {
  const map = new Map();
  risks.forEach(r => {
    if (!_isRiskVisible(r)) return;
    const sl = snap(r.likelihood), ss = snap(r.severity);
    if (sl < VR.xMin-0.26 || sl > VR.xMax+0.26) return;
    if (ss < VR.yMin-0.26 || ss > VR.yMax+0.26) return;
    const key = sl+','+ss;
    if (!map.has(key)) map.set(key, { risks: [], likelihood: sl, severity: ss });
    map.get(key).risks.push(r);
  });
  return [...map.values()];
}

const MAX_PER_ROW = 3, CHAR_W = 6, ROW_H = 14, PAD_X = 4, PAD_Y = 3;

function getLabelLayout(ids) {
  const rows = [];
  for (let i = 0; i < ids.length; i += MAX_PER_ROW)
    rows.push(ids.slice(i, i + MAX_PER_ROW));
  const maxChars = Math.max(...rows.map(r => r.join('  ').length));
  return { rows, w: Math.max(32, maxChars * CHAR_W + PAD_X * 2), h: rows.length * ROW_H + PAD_Y * 2 };
}

// ── clearY: bubble label past blocking dots ───────────────────────────────────
const DOT_R = 10, VGAP = 11;

// ── Multi-colour pie-chart dot stroke ─────────────────────────────────────────
// Draws the black dot with arc-segments around it, one per category colour.
// Uses stroke-dasharray so each arc covers 1/N of the circumference.
function drawPieDot(cx, cy, categories, parent) {
  const R  = DOT_R;
  const SW = 3;                          // stroke width
  const C  = 2 * Math.PI * (R + SW / 2); // circumference at stroke mid-point
  const unique = [...new Set(categories.map(c => catColor(c || '')))];
  const N  = unique.length;
  const seg = C / N;

  // Thin black outer border drawn FIRST (behind everything).
  // SW+2 makes it 1px wider each side than the coloured ring, so exactly 1px
  // of black peeks outside the colours while the inner part is covered by them.
  mk('circle', { cx, cy, r: R, fill: 'none', stroke: '#000', 'stroke-width': SW + 2 }, parent);

  // Black filled centre
  mk('circle', { cx, cy, r: R, fill: '#111827' }, parent);

  // White base ring so colours show clearly
  mk('circle', { cx, cy, r: R, fill: 'none', stroke: 'rgba(255,255,255,0.25)', 'stroke-width': SW }, parent);

  // One arc per colour, rotated so first arc starts at 12 o'clock
  unique.forEach((col, i) => {
    mk('circle', {
      cx, cy, r: R,
      fill: 'none',
      stroke: col,
      'stroke-width': SW,
      'stroke-dasharray': `${seg.toFixed(2)} ${(C - seg).toFixed(2)}`,
      'stroke-dashoffset': (C / 4 - i * seg).toFixed(2),
    }, parent);
  });
}

function buildItems(groups) {
  const allDots = groups.map(g => ({ cx: svgX(g.likelihood), cy: svgY(g.severity) }));
  const GAP = 5;  // minimum gap between any two elements
  const placedRects = [];

  // ── Exact collision checks ─────────────────────────────────────────────────

  // Rect-rect overlap
  function rectsOverlap(a, b) {
    return Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x) > GAP &&
           Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y) > GAP;
  }

  // Circle-rect overlap (nearest point on rect to circle centre)
  function circleRectOverlap(dcx, dcy, r, rect) {
    const nx = Math.max(rect.x, Math.min(rect.x+rect.w, dcx));
    const ny = Math.max(rect.y, Math.min(rect.y+rect.h, dcy));
    return (nx-dcx)**2 + (ny-dcy)**2 < (r+GAP)**2;
  }

  // Vertical line (at x=cx, y from y1 to y2) crossing a rect
  function lineRectCross(cx, y1, y2, rect) {
    const yLo = Math.min(y1,y2)+2, yHi = Math.max(y1,y2)-2;
    return cx > rect.x-1 && cx < rect.x+rect.w+1 && yHi > rect.y && yLo < rect.y+rect.h;
  }

  // Vertical line passing within DOT_R of a dot circle
  function lineDotCross(cx, y1, y2, dcx, dcy) {
    if (Math.abs(dcx-cx) >= DOT_R+GAP) return false;
    const yLo = Math.min(y1,y2)+2, yHi = Math.max(y1,y2)-2;
    return yHi > dcy-DOT_R && yLo < dcy+DOT_R;
  }

  // Is this rect position fully valid? (no label, no dot, connector clear)
  function isValid(rect, cx, cy) {
    // 1. label-label
    for (const r of placedRects) {
      if (rectsOverlap(rect, r)) return false;
    }
    // 2. label-dot (other dots only, using exact circle-rect check)
    for (const { cx: dcx, cy: dcy } of allDots) {
      if (dcx===cx && dcy===cy) continue;
      if (circleRectOverlap(dcx, dcy, DOT_R, rect)) return false;
    }
    // 3. connector clearance (straight vertical line at x=cx)
    const above  = rect.y + rect.h <= cy;
    const dotEdge   = above ? cy - DOT_R : cy + DOT_R;
    const labelEdge = above ? rect.y + rect.h : rect.y;
    const yMin = Math.min(dotEdge, labelEdge)+2, yMax = Math.max(dotEdge, labelEdge)-2;
    if (yMin < yMax) {
      for (const r of placedRects) {
        if (lineRectCross(cx, yMin, yMax, r)) return false;
      }
      for (const { cx: dcx, cy: dcy } of allDots) {
        if (dcx===cx && dcy===cy) continue;
        if (lineDotCross(cx, yMin, yMax, dcx, dcy)) return false;
      }
    }
    return true;
  }

  // Scan outward from dot in one direction until a valid position is found.
  // Step size = lh so we check one label-height slot at a time.
  function findValidY(cx, lw, lh, cy, dir) {
    const lx    = Math.max(LB.xMin, Math.min(LB.xMax-lw, cx-lw/2));
    const start = dir==='below' ? cy+DOT_R+VGAP : cy-DOT_R-VGAP-lh;
    const limit = dir==='below' ? LB.yMax-lh    : LB.yMin;
    const step  = dir==='below' ? 1 : -1;
    let   y     = start;
    let   iters = 0;
    while ((dir==='below' ? y<=limit : y>=limit) && iters++ < 800) {
      const rect = { x:lx, y, w:lw, h:lh };
      if (isValid(rect, cx, cy)) return y;
      // Jump past the nearest conflicting blocker in this direction
      let jump = lh + GAP;
      for (const r of placedRects) {
        if (Math.min(lx+lw, r.x+r.w) - Math.max(lx, r.x) <= GAP) continue;
        if (dir==='below' && r.y >= y && r.y < y+lh+GAP)
          jump = Math.min(jump, r.y+r.h+GAP - y);
        if (dir==='above' && r.y+r.h <= y+lh && r.y+r.h > y-GAP)
          jump = Math.min(jump, (y+lh) - r.y + GAP);
      }
      for (const { cx: dcx, cy: dcy } of allDots) {
        if (dcx===cx && dcy===cy) continue;
        if (Math.min(lx+lw, dcx+DOT_R+GAP) - Math.max(lx, dcx-DOT_R-GAP) <= 0) continue;
        if (dir==='below' && dcy >= y-DOT_R-GAP && dcy < y+lh+DOT_R+GAP)
          jump = Math.min(jump, dcy+DOT_R+GAP - y);
        if (dir==='above' && dcy+DOT_R+GAP >= y && dcy-DOT_R-GAP < y+lh)
          jump = Math.min(jump, (y+lh) - (dcy-DOT_R-GAP));
      }
      y += step * Math.max(1, Math.ceil(jump));
    }
    return null;
  }

  // Process highest severity first (most constrained labels place early)
  const ordered = [...groups].sort((a,b) => b.severity - a.severity);

  const placed = ordered.map(({ risks, likelihood, severity }) => {
    const cx  = svgX(likelihood), cy = svgY(severity);
    const ids = risks.map(r => r.id);
    const { rows, w: lw, h: lh } = getLabelLayout(ids);
    const lx  = Math.max(LB.xMin, Math.min(LB.xMax-lw, cx-lw/2));

    const yA = findValidY(cx, lw, lh, cy, 'above');
    const yB = findValidY(cx, lw, lh, cy, 'below');

    let ly;
    if (yA !== null && yB !== null) {
      ly = Math.abs(yA+lh/2-cy) <= Math.abs(yB+lh/2-cy) ? yA : yB;
    } else {
      ly = yA ?? yB ?? Math.max(LB.yMin, cy-DOT_R-VGAP-lh);
    }

    const rect = { x:lx, y:ly, w:lw, h:lh };
    placedRects.push(rect);
    return { groups:[{risks,cx,cy}], rows, rect };
  });

  return groups.map(g =>
    placed.find(it => it.groups[0].cx===svgX(g.likelihood) && it.groups[0].cy===svgY(g.severity))
  );
}

// ── Force resolution ──────────────────────────────────────────────────────────
function resolveCollisions(items) {
  const GAP = 5, MAX_ITER = 500;
  for (let iter = 0; iter < MAX_ITER; iter++) {
    let moved = false;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i].rect, b = items[j].rect;
        const ox = Math.min(a.x+a.w, b.x+b.w) - Math.max(a.x, b.x) + GAP;
        const oy = Math.min(a.y+a.h, b.y+b.h) - Math.max(a.y, b.y) + GAP;
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        if (ox <= oy) {
          const p = ox/2;
          if (a.x+a.w/2 < b.x+b.w/2) { a.x -= p; b.x += p; } else { a.x += p; b.x -= p; }
        } else {
          const p = oy/2;
          if (a.y+a.h/2 < b.y+b.h/2) { a.y -= p; b.y += p; } else { a.y += p; b.y -= p; }
        }
        for (const r of [a, b]) {
          r.x = Math.max(LB.xMin, Math.min(LB.xMax - r.w, r.x));
          r.y = Math.max(LB.yMin, Math.min(LB.yMax - r.h, r.y));
        }
      }
    }
    if (!moved) break;
  }
  // Horizontal dot clearance
  const DEXCL = DOT_R + 4;
  for (const item of items) {
    const r = item.rect;
    for (const other of items) {
      if (other === item) continue;
      for (const { cx: dcx, cy: dcy } of other.groups) {
        if (!(dcy+DEXCL > r.y && dcy-DEXCL < r.y+r.h)) continue;
        if (!(dcx+DEXCL > r.x && dcx-DEXCL < r.x+r.w)) continue;
        r.x = r.x+r.w/2 < dcx ? dcx-DEXCL-r.w : dcx+DEXCL;
        r.x = Math.max(LB.xMin, Math.min(LB.xMax-r.w, r.x));
      }
    }
  }
}

// ── Proximity merge ───────────────────────────────────────────────────────────
// Only merge pairs of adjacent labels (gap < MERGE_DIST) where the combined
// risk count stays ≤ MAX_MERGE_IDS. This prevents runaway cluster growth.
function mergeClose(items) {
  const MERGE_DIST    = 4;   // gap between label boxes to trigger merge
  const MAX_MERGE_IDS = 6;  // cap merged label at 6 risk IDs
  // Dots at different 0.5-unit snap positions are at least 60px apart (horizontal)
  // or 68px apart (vertical). Diagonal adjacent = ~91px. Cap below that so only
  // labels for horizontally or vertically adjacent dots (not diagonal) can merge.
  const MAX_DOT_DIST  = 80;

  function gap(a, b) {
    const gx = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x+a.w, b.x+b.w));
    const gy = Math.max(0, Math.max(a.y, b.y) - Math.min(a.y+a.h, b.y+b.h));
    return Math.sqrt(gx*gx + gy*gy);
  }

  function countIds(item) {
    return item.groups.reduce((n, g) => n + g.risks.length, 0);
  }

  function buildMerged(a, b) {
    const allGroups = [...a.groups, ...b.groups];
    const allRisks  = allGroups.flatMap(g => g.risks);
    const { rows, w: lw, h: lh } = getLabelLayout(allRisks.map(r => r.id));
    const avgX = (a.rect.x + a.rect.w/2 + b.rect.x + b.rect.w/2) / 2;
    const avgY = (a.rect.y + a.rect.h/2 + b.rect.y + b.rect.h/2) / 2;
    const lx   = Math.max(LB.xMin, Math.min(LB.xMax-lw, avgX - lw/2));
    const ly   = Math.max(LB.yMin, Math.min(LB.yMax-lh, avgY - lh/2));
    return { groups: allGroups, rows, rect: { x: lx, y: ly, w: lw, h: lh } };
  }

  // Single pass: for each unmerged item, check if it can merge with the
  // next unmerged item that is close enough and within the ID cap.
  let current = [...items];
  let changed  = true;
  while (changed) {
    changed = false;
    const next = [];
    const used = new Set();
    for (let i = 0; i < current.length; i++) {
      if (used.has(i)) continue;
      let merged = false;
      for (let j = i + 1; j < current.length; j++) {
        if (used.has(j)) continue;
        if (gap(current[i].rect, current[j].rect) < MERGE_DIST &&
            countIds(current[i]) + countIds(current[j]) <= MAX_MERGE_IDS &&
            current[i].groups.every(ga => current[j].groups.every(gb => {
              const dx = ga.cx - gb.cx, dy = ga.cy - gb.cy;
              return Math.sqrt(dx*dx + dy*dy) <= MAX_DOT_DIST;
            }))) {
          next.push(buildMerged(current[i], current[j]));
          used.add(i); used.add(j);
          merged = true; changed = true;
          break;
        }
      }
      if (!merged) next.push(current[i]);
    }
    current = next;
  }
  return current;
}

// Nearest label-edge point to a dot
function connAnchor(cx, cy, rect) {
  const { x: lx, y: ly, w: lw, h: lh } = rect;
  const dx = (lx+lw/2) - cx, dy = (ly+lh/2) - cy;
  if (Math.abs(dy) >= Math.abs(dx))
    return dy > 0 ? { x: Math.max(lx, Math.min(lx+lw,cx)), y: ly }
                  : { x: Math.max(lx, Math.min(lx+lw,cx)), y: ly+lh };
  return dx > 0 ? { x: lx,    y: Math.max(ly, Math.min(ly+lh,cy)) }
                : { x: lx+lw, y: Math.max(ly, Math.min(ly+lh,cy)) };
}

// ── Gradient coords (anchored to data space so zoom/pan moves the colours) ────
function updateGradientCoords() {
  const g = document.getElementById('gDiag');
  // Anchor green at data(0,0) and red at data(5,5) in SVG pixel space
  g.setAttribute('x1', svgX(0).toFixed(1));
  g.setAttribute('y1', svgY(0).toFixed(1));
  g.setAttribute('x2', svgX(5).toFixed(1));
  g.setAttribute('y2', svgY(5).toFixed(1));
}

// Lite render — dots only, no label recalculation. Used during drag for
// smooth 60fps pan without the expensive buildItems/resolveCollisions pass.
function liteRender() {
  updateGradientCoords();
  const layer = document.getElementById('risks-layer');
  while (layer.firstChild) layer.removeChild(layer.firstChild);
  groupRisks(RISKS).forEach(({ risks, likelihood, severity }) => {
    const cx = svgX(likelihood), cy = svgY(severity);
    const dotG = mk('g', {}, layer);
    drawPieDot(cx, cy, risks.map(r => r.category || ''), dotG);
  });
}

// Per-corner rounded rect path. tl/tr/br/bl = corner radii (0 = square).
function roundedRectPath(x, y, w, h, tl, tr, br, bl) {
  const p = [`M ${x+tl},${y}`];
  p.push(`L ${x+w-tr},${y}`);
  p.push(tr ? `Q ${x+w},${y} ${x+w},${y+tr}` : `L ${x+w},${y}`);
  p.push(`L ${x+w},${y+h-br}`);
  p.push(br ? `Q ${x+w},${y+h} ${x+w-br},${y+h}` : `L ${x+w},${y+h}`);
  p.push(`L ${x+bl},${y+h}`);
  p.push(bl ? `Q ${x},${y+h} ${x},${y+h-bl}` : `L ${x},${y+h}`);
  p.push(`L ${x},${y+tl}`);
  p.push(tl ? `Q ${x},${y} ${x+tl},${y}` : `L ${x},${y}`);
  return p.join(' ') + ' Z';
}

// ── Static chart ──────────────────────────────────────────────────────────────
function renderStatic() {
  updateGradientCoords();
  const layer = document.getElementById('static-layer');
  const { x, y, w, h } = P;
  // Right corners are square when connected to the list; rounded when graph is alone
  const rRight = _graphAllRounded ? 20 : 0;
  mk('path', { d: roundedRectPath(x,y,w,h, 20,rRight,rRight,20), fill: 'url(#gDiag)' }, layer);

  // Trend mode: dim the gradient so trail lines stay readable against any heatmap color.
  // Placed after gradient rect but before grid lines — grid/quadrant lines stay unaffected.
  if (_trendRisks.size > 0) {
    mk('path', { d: roundedRectPath(x,y,w,h, 20,rRight,rRight,20), fill: 'rgba(10,10,14,0.45)' }, layer);
  }

  // Allegion logo watermark — 80% of plot size, centred, above gradient, below grid lines
  const logoW = w * 0.8, logoH = h * 0.8;
  mk('image', {
    href: LOGO_SRC,
    x: x + (w - logoW) / 2, y: y + (h - logoH) / 2,
    width: logoW, height: logoH,
    opacity: 0.20,
    preserveAspectRatio: 'xMidYMid meet'
  }, layer);

  // Dynamic grid lines and labels for current VR (data view range)
  const STEP = 0.5;
  function rangeTicks(lo, hi) {
    const out = [], s = Math.ceil(lo/STEP)*STEP;
    for (let v=s; v<=hi+0.001; v+=STEP) out.push(parseFloat(v.toFixed(2)));
    return out;
  }
  const gcol = 'rgba(255,255,255,0.5)';
  rangeTicks(VR.xMin, VR.xMax).forEach(v => {
    const sx = svgX(v);
    if (sx < x-1 || sx > x+w+1) return;
    mk('line',{x1:sx,y1:y,x2:sx,y2:y+h,stroke:gcol,'stroke-width':v===Math.round(v)?1.0:0.4},layer);
    if (v >= 0.99 && v < VR.xMax - 0.01) // skip rightmost tick (space used by panel pills)
      mktxt(v.toFixed(1),{x:sx,y:y+h+16,'text-anchor':'middle','font-size':10,fill:'#444','font-family':AXIS_FONT},layer);
  });
  rangeTicks(VR.yMin, VR.yMax).forEach(v => {
    const sy = svgY(v);
    if (sy < y-1 || sy > y+h+1) return;
    mk('line',{x1:x,y1:sy,x2:x+w,y2:sy,stroke:gcol,'stroke-width':v===Math.round(v)?1.0:0.4},layer);
    if (v >= 0.99)
      mktxt(v.toFixed(1),{x:x-8,y:sy+4,'text-anchor':'end','font-size':10,fill:'#444','font-family':AXIS_FONT},layer);
  });
  if (VR.xMin<=2.5 && VR.xMax>=2.5)
    mk('line',{x1:svgX(2.5),y1:y,x2:svgX(2.5),y2:y+h,stroke:'rgba(0,0,0,0.45)','stroke-width':2},layer);
  if (VR.yMin<=2.5 && VR.yMax>=2.5)
    mk('line',{x1:x,y1:svgY(2.5),x2:x+w,y2:svgY(2.5),stroke:'rgba(0,0,0,0.45)','stroke-width':2},layer);
  // Graph border — open path (no right edge); card draws the matching right+top+bottom border
  const BSTROKE = 'rgba(0,0,0,0.45)';
  if (_graphAllRounded) {
    mk('path',{d:roundedRectPath(x,y,w,h,20,20,20,20),fill:'none',stroke:BSTROKE,'stroke-width':1.5},layer);
  } else {
    const gBorder = `M ${x+w},${y} L ${x+20},${y} Q ${x},${y} ${x},${y+20} L ${x},${y+h-20} Q ${x},${y+h} ${x+20},${y+h} L ${x+w},${y+h}`;
    mk('path',{d:gBorder,fill:'none',stroke:BSTROKE,'stroke-width':1.5},layer);
  }
  mktxt('Likelihood',{x:x+w/2,y:y+h+34,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#333','font-family':AXIS_FONT},layer);
  const sev=mktxt('Severity',{'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#333','font-family':AXIS_FONT,transform:`rotate(-90,${x-44},${y+h/2})`},layer);
  sev.setAttribute('x',x-44); sev.setAttribute('y',y+h/2);
  // Timestamp hidden until live-updating data is available
  if (false && LAST_UPDATED && LAST_UPDATED !== 'Unknown') {
    mktxt(`Data as of ${LAST_UPDATED}`, {
      x: x + w, y: y + h + 50, 'text-anchor': 'end',
      'font-size': 9.5, fill: '#666', 'font-family': AXIS_FONT, opacity: 0.7
    }, layer);
  }
}

// ── Render risks ──────────────────────────────────────────────────────────────
function renderRisks() {
  // Reset dim state — old dotG elements are about to be destroyed so mouseleave won't fire
  _dimCount = 0;
  document.getElementById('legend-layer').classList.remove('legend-dimmed');
  Object.keys(dotGroupByRiskId).forEach(k => delete dotGroupByRiskId[k]);
  Object.keys(dotRisksGroupById).forEach(k => delete dotRisksGroupById[k]);
  const layer  = document.getElementById('risks-layer');
  const visibleRisks = _trendRisks.size > 0 ? RISKS.filter(r => _trendRisks.has(r.id)) : RISKS;
  const groups = groupRisks(visibleRisks);
  let items    = buildItems(groups);
  resolveCollisions(items);
  items = mergeClose(items);

  items.forEach(({ groups: grps, rows, rect }) => {
    const { x: lx, y: ly, w: lw, h: lh } = rect;

    // Dominant category for border colour (most common in this label)
    const cats = grps.flatMap(g => g.risks.map(r => r.category || ''));
    const freq = {}; cats.forEach(c => { freq[c] = (freq[c]||0)+1; });
    const domCat = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0] || '';
    const borderCol = catColor(domCat);

    const g = mk('g', { class: 'risk-group' }, layer);

    // Label box (drawn first so connectors and dots appear on top)
    mk('rect', { class: 'label-box', x: lx, y: ly, width: lw, height: lh, rx: 3,
                 fill: '#2D2D2E', stroke: borderCol, 'stroke-width': 1.5 }, g);

    // Text: each ID coloured by its category using tspan elements
    const allIds = grps.flatMap(gr => gr.risks.map(r => r.id));
    const layout = getLabelLayout(allIds);
    layout.rows.forEach((row, i) => {
      const textEl = mk('text', {
        class: 'label-text',
        x: lx + lw / 2, y: ly + PAD_Y + (i + 0.82) * ROW_H,
        'text-anchor': 'middle', 'font-size': 9.5, 'font-weight': 700, 'font-family': FONT
      }, g);
      row.forEach((id, idx) => {
        const span = document.createElementNS(NS, 'tspan');
        span.textContent = id;
        span.setAttribute('fill', catColor(ID_TO_CAT[id] || ''));
        textEl.appendChild(span);
        if (idx < row.length - 1) {
          const sep = document.createElementNS(NS, 'tspan');
          sep.textContent = '  '; sep.setAttribute('fill', '#aaa');
          textEl.appendChild(sep);
        }
      });
    });

    // Per-dot: connector + dot + individual tooltip (only that dot's risks)
    grps.forEach(({ risks: grpRisks, cx, cy }) => {
      const col    = catColor(grpRisks[0]?.category || '');
      const anchor = connAnchor(cx, cy, rect);
      const dotG   = mk('g', { class: 'dot-hover' }, g);

      grpRisks.forEach(r => { dotGroupByRiskId[r.id] = dotG; dotRisksGroupById[r.id] = grpRisks; });

      // Thicker, more visible connector with category colour
      // Bezier connector when dot sits exactly on the 2.5 quadrant line
      // (straight connector would fuse visually with the thick axis)
      if (Math.abs(cx - svgX(2.5)) < 3) {
        const mid = { x: cx + 32, y: (cy + anchor.y) / 2 };
        mk('path', {
          class: 'conn-line',
          d: 'M '+cx+' '+cy+' Q '+mid.x+' '+mid.y+' '+anchor.x+' '+anchor.y,
          stroke: col, 'stroke-width': 1.8, fill: 'none', opacity: 0.85
        }, dotG);
      } else {
        mk('line', { class: 'conn-line', x1: cx, y1: cy, x2: anchor.x, y2: anchor.y,
                     stroke: col, 'stroke-width': 1.8, opacity: 0.85 }, dotG);
      }

      // ── Status ring (overdue review or poor mitigation health) ─────────────
      const isOverdue   = grpRisks.some(r => String(r.review_overdue).toLowerCase() === 'true');
      const isPoorHealth = grpRisks.some(r => {
        const h = (r.mitigation_health || '').toLowerCase();
        return h.includes('risk') || h.includes('behind');
      });
      if (isOverdue || isPoorHealth) {
        const ringCol  = isOverdue ? '#E53935' : '#FF9800';
        const ringGlow = isOverdue ? 'rgba(229,57,53,0.7)' : 'rgba(255,152,0,0.7)';
        const ringR    = DOT_R + 5;
        const C3 = 2 * Math.PI * ringR;
        mk('circle', { cx, cy, r:ringR, fill:'none', stroke:ringCol,
          'stroke-width':1.5,
          'stroke-dasharray':`${(C3/10).toFixed(1)} ${(C3/10).toFixed(1)}`,
          class:'status-ring', 'pointer-events':'none',
          style:`--ring-glow:${ringGlow}` }, g);
      }

      const scaleG = mk('g', { class: 'dot-scale-wrapper' }, dotG);
      dotG._sw = scaleG;
      const spinG = mk('g', { class: 'dot-spin' }, scaleG);
      drawPieDot(cx, cy, grpRisks.map(r => r.category || ''), spinG);

      dotG.addEventListener('mouseenter', e => {
        showTip(e, grpRisks);
        grpRisks.forEach(r => {
          const row = legendRowByRiskId[r.id];
          if (row) row.classList.add('legend-row-hl');
        });
        if (!_spotlightOwner) dimLegend(true); // spotlight owns dim state exclusively
      });
      dotG.addEventListener('mousemove',  moveTip);
      dotG.addEventListener('mouseleave', () => {
        hideTip();
        grpRisks.forEach(r => {
          const row = legendRowByRiskId[r.id];
          // Keep highlight if spotlight is active for this risk
          if (row && !_isSpotlightRisk(r)) row.classList.remove('legend-row-hl');
        });
        // Don't un-dim if spotlight is active — it manages the dim state
        if (!_spotlightOwner) dimLegend(false);
      });
      dotG.addEventListener('click', e => {
        e.stopPropagation();
        // If spotlight is active and this dot has no spotlighted risk, clear spotlight first
        if (_spotlightOwner && !grpRisks.some(r => _isSpotlightRisk(r))) clearSpotlight();
        openModal(grpRisks);
      });
    });
  });
}

const RH_ITEMS = ['rh-id','rh-name','rh-divider','rh-search-btn','rh-mf-wrap','rh-cat-wrap','rh-owner-wrap'];
let _searchActive = false;
const _searchHighlighted = new Set();  // row elements highlighted by search
const _searchTextEls     = new Map();  // risk id → { el, original } for tspan cleanup

function _rhAnimate(cls, delay = 30) {
  RH_ITEMS.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    const opp = cls === 'rh-exit' ? 'rh-enter' : 'rh-exit';
    el.classList.remove(opp);
    void el.offsetWidth;
    el.style.animationDelay = (i * delay) + 'ms';
    el.classList.add(cls);
    if (cls === 'rh-enter') {
      el.addEventListener('animationend', () => {
        el.classList.remove('rh-enter');
        el.style.animationDelay = '';
      }, { once: true });
    }
  });
}

function openSearch() {
  if (_searchActive) return;
  _searchActive = true;
  _updateResetBtn();
  closeCatDropdown();
  _rhAnimate('rh-exit');
  setTimeout(() => {
    const bar = document.getElementById('rh-search-bar');
    bar.classList.add('open');
    setTimeout(() => document.getElementById('rh-search-input').focus(), 200);
  }, 120);
}

function closeSearch() {
  if (!_searchActive) return;
  _searchActive = false;
  clearSearchFilter();
  _closeSearchPanel();
  _updateResetBtn();
  const bar = document.getElementById('rh-search-bar');
  bar.classList.remove('open');
  document.getElementById('rh-search-input').value = '';
  setTimeout(() => _rhAnimate('rh-enter'), 160);
}

function _highlightNameText(textEl, fullText, query) {
  // Clear existing children
  while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
  const idx = fullText.toLowerCase().indexOf(query.toLowerCase());
  if (idx < 0) { textEl.textContent = fullText; return; }
  const mkspan = (txt, fill) => {
    const s = document.createElementNS(NS, 'tspan');
    s.textContent = txt; s.setAttribute('fill', fill); return s;
  };
  if (idx > 0)                          textEl.appendChild(mkspan(fullText.slice(0, idx), '#BEC0C6'));
                                        textEl.appendChild(mkspan(fullText.slice(idx, idx + query.length), '#FF671F'));
  if (idx + query.length < fullText.length) textEl.appendChild(mkspan(fullText.slice(idx + query.length), '#BEC0C6'));
}

function _restoreNameText(textEl, originalText) {
  while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
  textEl.textContent = originalText;
}

function applySearchFilter(query) {
  const ll = document.getElementById('legend-layer');
  // Restore any previously highlighted text elements
  _searchTextEls.forEach(({ el, original }) => _restoreNameText(el, original));
  _searchTextEls.clear();
  _searchHighlighted.forEach(row => row.classList.remove('legend-row-hl'));
  _searchHighlighted.clear();

  if (!query) { ll.classList.remove('search-active'); return; }

  const q = query.toLowerCase();
  ll.classList.add('search-active');
  RISKS.forEach(r => {
    if (!_isRiskVisible(r)) return;
    const nameMatch = r.name.toLowerCase().includes(q);
    const idMatch   = r.id.toLowerCase().includes(q);
    const row = legendRowByRiskId[r.id];
    if (row && (nameMatch || idMatch)) {
      row.classList.add('legend-row-hl');
      _searchHighlighted.add(row);
      // Highlight matched portion in the name text element
      if (nameMatch) {
        const textEl = row.querySelector('text[font-weight="500"]');
        if (textEl && !_searchTextEls.has(r.id)) {
          _searchTextEls.set(r.id, { el: textEl, original: r.name });
          _highlightNameText(textEl, r.name, query);
        }
      }
    }
  });
}

function clearSearchFilter() {
  _searchTextEls.forEach(({ el, original }) => _restoreNameText(el, original));
  _searchTextEls.clear();
  _searchHighlighted.forEach(row => row.classList.remove('legend-row-hl'));
  _searchHighlighted.clear();
  document.getElementById('legend-layer').classList.remove('search-active');
}

function updateCatFilterBtn() {

    ? 'Filter by category'

let _morphing = false; // prevent both menus opening during morph transition

// Helpers so _switchToDropdown works for any of the three dropdowns
function _ddBtn(id) {
  return id === 'cat'   ? document.getElementById('cat-filter-btn')
       : id === 'mf'    ? document.getElementById('rh-mf-btn')
       : id === 'owner' ? document.getElementById('owner-filter-btn')
       : null;
}
function _buildDdContent(id) {
  if (id === 'mf')    buildMfDropdown();
  if (id === 'owner') buildOwnerDropdown();
  // cat is rebuilt inside openCatDropdown itself
}

function _switchToDropdown(closeId, openId) {
  if (_morphing) return;
  _morphing = true;
  const closeDd = document.getElementById(closeId + '-dropdown');
  const openDd  = document.getElementById(openId  + '-dropdown');
  _buildDdContent(openId);

  // Measure both rects before any mutations
  const cr = closeDd.getBoundingClientRect();
  openDd.style.display = 'flex'; openDd.style.visibility = 'hidden';
  const or = openDd.getBoundingClientRect();
  openDd.style.display = ''; openDd.style.visibility = '';

  // Exit content: set transition this frame, change values next frame
  const closeKids = [...closeDd.children];
  closeKids.forEach(el => { el.style.transition = 'opacity 0.1s ease, transform 0.1s ease'; });
  requestAnimationFrame(() => {
    closeKids.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(-4px)'; });
  });

  setTimeout(() => {
    closeKids.forEach(el => { el.style.transition = el.style.opacity = el.style.transform = ''; });

    // FLIP morph panel: physically at destination size/position,
    // but a CSS transform makes it APPEAR at the source size/position.
    // Animating transform → identity = pure GPU morph, no layout recalculation.
    const scaleX = cr.width  / or.width;
    const scaleY = cr.height / or.height;
    const tx     = cr.left   - or.left;
    const ty     = cr.top    - or.top;

    const morph = document.createElement('div');
    morph.style.cssText = `
      position:fixed; left:${or.left}px; top:${or.top}px;
      width:${or.width}px; height:${or.height}px;
      background:rgba(20,20,22,0.97);
      border:1px solid rgba(255,255,255,0.12);
      border-top-color:rgba(255,255,255,0.22);
      border-radius:20px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.10),0 16px 48px rgba(0,0,0,0.72);
      transform-origin:top left;
      transform:translate(${tx}px,${ty}px) scaleX(${scaleX}) scaleY(${scaleY});
      z-index:302; pointer-events:none;
      transition:transform 0.30s cubic-bezier(0.4,0,0.1,1);
    `;
    document.body.appendChild(morph);

    // Hide source dropdown (morph panel covers it — overlay stays active throughout)
    closeDd.classList.remove('open', 'closing');
    _ddBtn(closeId)?.classList.remove('open');
    // Ensure overlay is active for the entire morph transition
    document.getElementById('cat-list-overlay').classList.add('dd-open');

    // Play: animate transform to identity → panel morphs to destination
    void morph.offsetWidth;
    morph.style.transform = 'translate(0,0) scaleX(1) scaleY(1)';

    // Fire content the instant the panel reaches its final position — no fixed delay
    morph.addEventListener('transitionend', function onMorphDone(e) {
      if (e.propertyName !== 'transform') return;
      morph.removeEventListener('transitionend', onMorphDone);
      morph.remove();
      // Guard: if resetAllFilters() ran during the morph it set _morphing=false;
      // skip reopening the destination dropdown to avoid it popping back up after reset.
      if (!_morphing) return;
      openDd.classList.remove('closing');
      openDd.style.animationDuration = '0s';
      openDd.classList.add('open');
      document.getElementById('cat-list-overlay').classList.add('dd-open');
      _ddBtn(openId)?.classList.add('open');

      const openKids = [...openDd.children];
      openKids.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(5px)'; });

      requestAnimationFrame(() => requestAnimationFrame(() => {
        let remaining = openKids.length || 1;
        openKids.forEach((el, i) => {
          el.style.transition = `opacity 0.14s ease ${i * 20}ms, transform 0.14s ease ${i * 20}ms`;
          el.style.opacity = '1'; el.style.transform = 'translateY(0)';
          el.addEventListener('transitionend', function h() {
            el.removeEventListener('transitionend', h);
            el.style.transition = el.style.opacity = el.style.transform = '';
            if (--remaining === 0) openDd.style.animationDuration = '';
          });
        });
        if (!openKids.length) openDd.style.animationDuration = '';
      }));
      _morphing = false;
    });
  }, 110);
}

function openCatDropdown() {
  if (_morphing) return;
  const mfDd    = document.getElementById('mf-dropdown');
  const ownerDd = document.getElementById('owner-dropdown');
  if (mfDd.classList.contains('open') || mfDd.classList.contains('closing')) {

  }
  if (ownerDd.classList.contains('open') || ownerDd.classList.contains('closing')) {
    closeOwnerDropdown(); // close owner without morphing before opening cat
  }
  const dd  = document.getElementById('cat-dropdown');
  const btn = document.getElementById('cat-filter-btn');
  dd.classList.remove('closing');
  void dd.offsetWidth;
  dd.classList.add('open');
  btn.classList.add('open');
  document.getElementById('cat-list-overlay').classList.add('dd-open');
}

function closeCatDropdown() {
  const dd  = document.getElementById('cat-dropdown');
  const btn = document.getElementById('cat-filter-btn');
  if (!dd.classList.contains('open')) return;
  dd.classList.add('closing');
  btn.classList.remove('open');
  if (!document.getElementById('mf-dropdown').classList.contains('open') &&
      !document.getElementById('owner-dropdown').classList.contains('open'))
    document.getElementById('cat-list-overlay').classList.remove('dd-open');
  // Guard: only act if still mid-close. Prevents stale listeners (left over when
  // resetAllFilters() force-removed 'open' before animation completed) from firing
  // on the *next* open animation and instantly re-closing the dropdown.
  dd.addEventListener('animationend', () => {
    if (dd.classList.contains('closing'))
      dd.classList.remove('open', 'closing');
  }, { once: true });
}

// ── Sort ──────────────────────────────────────────────────────────────────────
const SORT_MODES = [
  { key:'id',          label:'Risk ID' },
  { key:'score',       label:'Risk Score' },
  { key:'severity',    label:'Severity' },
  { key:'likelihood',  label:'Likelihood' },
];
function setSortMode(key) {
  _listSort = key;
  updateMfBtn();
  rerender();
  renderLegend();
}

// ── Multi-filter dropdown ─────────────────────────────────────────────────────
function buildMfDropdown() {
  const dd = document.getElementById('mf-dropdown');
  dd.innerHTML = '';

  const uniqueStatuses = [...new Set(RISKS.map(r => r.status).filter(Boolean))].sort();
  const uniqueHealths  = [...new Set(RISKS.map(r => r.mitigation_health).filter(Boolean))].sort();

  // ── Sort section ─────────────────────────────────────────────────────────
  const sortLbl = document.createElement('div');
  sortLbl.className = 'mf-section-label'; sortLbl.textContent = 'Sort By';
  dd.appendChild(sortLbl);
  SORT_MODES.forEach(mode => {
    const row = document.createElement('div');
    row.className = 'mf-row' + (_listSort === mode.key ? ' active' : '');
    row.innerHTML = `<span class="mf-swatch"></span><span class="mf-label">${mode.label}</span>`;
    row.addEventListener('click', e => {
      e.stopPropagation();
      setSortMode(mode.key);
      // Refresh the active state on all sort rows
      dd.querySelectorAll('.mf-row[data-sort]').forEach(r =>
        r.classList.toggle('active', r.dataset.sort === mode.key));
    });
    row.dataset.sort = mode.key;
    dd.appendChild(row);
  });

  const addSection = (title, items, filterSet) => {
    if (!items.length) return;
    const lbl = document.createElement('div');
    lbl.className = 'mf-section-label'; lbl.textContent = title;
    dd.appendChild(lbl);
    items.forEach(val => {
      const row = document.createElement('div');
      row.className = 'mf-row' + (filterSet.has(val) ? ' active' : '');
      row.innerHTML = `<span class="mf-swatch"></span><span class="mf-label">${val}</span>`;
      row.addEventListener('click', e => { e.stopPropagation();
        // Capture prev and mutate state synchronously, then defer work to next frame
        // so in-progress Web Animations can render their frame before new JS blocks the thread
        const prev = new Set(RISKS.filter(r => _isRiskVisible(r)).map(r => r.id));
        filterSet.has(val) ? filterSet.delete(val) : filterSet.add(val);
        row.classList.toggle('active', filterSet.has(val));
        requestAnimationFrame(() => {
          updateMfBtn(); updateFilterChip();
          _applyFilterWithAnimation(prev);
        });
      });
      dd.appendChild(row);
    });
  };

  // Overdue toggle
  const lbl0 = document.createElement('div');
  lbl0.className = 'mf-section-label'; lbl0.textContent = 'Review';
  dd.appendChild(lbl0);
  const ovRow = document.createElement('div');
  ovRow.className = 'mf-row' + (_activeFilters.overdue ? ' active' : '');
  ovRow.innerHTML = `<span class="mf-swatch"></span><span class="mf-label">Overdue only</span>`;
  ovRow.addEventListener('click', e => { e.stopPropagation();
    const prev = new Set(RISKS.filter(r => _isRiskVisible(r)).map(r => r.id));
    _activeFilters.overdue = !_activeFilters.overdue;
    ovRow.classList.toggle('active', _activeFilters.overdue);
    requestAnimationFrame(() => {
      updateMfBtn(); updateFilterChip();
      _applyFilterWithAnimation(prev);
    });
  });
  dd.appendChild(ovRow);

  const uniqueQuarters = [...new Set(RISKS.map(r => r.quarter).filter(Boolean))].sort();
  addSection('Quarter',           uniqueQuarters, _activeFilters.quarter);
  addSection('Risk Status',       uniqueStatuses, _activeFilters.status);
  addSection('Mitigation Health', uniqueHealths,  _activeFilters.health);
}

function updateMfBtn() {
  const filterActive = _activeFilters.status.size + _activeFilters.health.size + (_activeFilters.overdue ? 1 : 0);
  const sortActive   = _listSort !== 'id';
  const totalActive  = filterActive + (sortActive ? 1 : 0);
  document.getElementById('rh-mf-btn').classList.toggle('filtered', totalActive > 0);
  // Label stays "Filters" always — badge communicates count
  document.getElementById('rh-mf-label').textContent = 'Filters';
  const badge = document.getElementById('rh-mf-badge');
  badge.textContent = totalActive;
  badge.classList.toggle('visible', totalActive > 0);
}

function openMfDropdown() {
  if (_morphing) return;
  const catDd   = document.getElementById('cat-dropdown');
  const ownerDd = document.getElementById('owner-dropdown');
  if (catDd.classList.contains('open') || catDd.classList.contains('closing')) {

  if (ownerDd.classList.contains('open') || ownerDd.classList.contains('closing')) {

  const dd = document.getElementById('mf-dropdown');
  buildMfDropdown();

  dd.classList.add('open');

}

function closeMfDropdown() {
  const dd = document.getElementById('mf-dropdown');
  if (!dd.classList.contains('open')) return;
  dd.classList.add('closing');
  document.getElementById('rh-mf-btn').classList.remove('open');
  if (!document.getElementById('cat-dropdown').classList.contains('open') &&
      !document.getElementById('owner-dropdown').classList.contains('open'))
    document.getElementById('cat-list-overlay').classList.remove('dd-open');
  dd.addEventListener('animationend', () => {
    if (dd.classList.contains('closing'))

function toggleMfDropdown(e) {
  e.stopPropagation();
